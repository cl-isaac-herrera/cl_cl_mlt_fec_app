# Mensajes de validación en español.
#
# `config.i18n.default_locale = :es` (config/application.rb) sin este archivo hace
# que CADA error de validación salga como el bloque literal
# "Translation missing. Options considered were: - es.activerecord.errors..." —
# y ese texto viaja tal cual al usuario, porque los controllers de la API
# responden `ApiResponse.error(record.errors.full_messages.to_sentence)`.
#
# Solo se traduce lo que el producto realmente usa. Al agregar un validador nuevo
# (`numericality`, `confirmation`, …) hay que agregar su clave acá o el mensaje
# vuelve a salir roto. Un validador con `message:` explícito no pasa por acá.
es:
  # `full_messages.to_sentence` une los errores con estos conectores. Sin ellos
  # sale el default de Rails en inglés: "El nombre ... and La URL ...".
  support:
    array:
      words_connector: ", "
      two_words_connector: " y "
      last_word_connector: " y "

  errors:
    format: "%{attribute} %{message}"
    messages:
      blank: "no puede estar en blanco"
      taken: "ya está en uso"
      invalid: "no tiene un formato válido"
      inclusion: "no está incluido en la lista"
      exclusion: "no está disponible"
      required: "debe existir"
      too_long: "es demasiado largo (máximo %{count} caracteres)"
      too_short: "es demasiado corto (mínimo %{count} caracteres)"
      wrong_length: "no tiene la longitud correcta (%{count} caracteres)"
      not_a_number: "no es un número"
      greater_than: "debe ser mayor que %{count}"
      greater_than_or_equal_to: "debe ser mayor o igual que %{count}"
      less_than: "debe ser menor que %{count}"
      less_than_or_equal_to: "debe ser menor o igual que %{count}"

  activerecord:
    errors:
      format: "%{attribute} %{message}"
      messages:
        record_invalid: "La validación falló: %{errors}"
        taken: "ya está en uso"

    # Nombres visibles de modelos y atributos: sin esto el mensaje dice
    # "Sl url no puede estar en blanco" en vez de "La URL del Service Layer...".
    models:
      connection:
        one: Conexión
        other: Conexiones
      role:
        one: Rol
        other: Roles
      permission:
        one: Permiso
        other: Permisos
      company:
        one: Compañía
        other: Compañías
      user:
        one: Usuario
        other: Usuarios
      user_permission:
        one: Permiso del usuario
        other: Permisos del usuario
      sl_resource:
        one: Consulta de Service Layer
        other: Consultas de Service Layer

    attributes:
      connection:
        name: "El nombre"
        sl_url: "La URL del Service Layer"
        sl_type: "El motor de base de datos"
      role:
        name: "El nombre"
      permission:
        name: "El nombre"
        description: "La descripción"
        type: "El tipo"
      company:
        name: "El nombre"
        sap_db: "El código de base de SAP"
        # Bloque del emisor ante Hacienda. Sin estas claves el mensaje usa el
        # nombre de la columna humanizado y sale en inglés (§30).
        issuer_legal_name: "La razón social del emisor"
        issuer_id_type: "El tipo de identificación del emisor"
        issuer_id_number: "El número de identificación del emisor"
        economic_activity_code: "El código de actividad económica"
        tax_registry_8707: "El registro fiscal de la ley 8707"
        email_cc: "Los correos en copia"
        purchase_invoice_series: "La serie de facturas de compra"
        default_xml_tax_code: "El código de impuesto por defecto del XML"
        default_warehouse: "El almacén por defecto"
        email_sender_type: "El nombre para el envío de correos"
        freight_type: "El manejo de otros cargos"
      user:
        email: "El correo"
        name: "El nombre"
        sap_user: "El usuario de SAP"
        sap_password: "La contraseña de SAP"
        doc_number_preference: "El tipo de OC"
      user_role:
        company: "La compañía"
        role: "El rol"
        user: "El usuario"
      user_permission:
        # `permission_id` es el atributo del validador de unicidad y `permission`
        # el de la asociación: los dos mensajes le hablan al usuario del permiso.
        permission_id: "El permiso"
        permission: "El permiso"
        user: "El usuario"
      users_by_company:
        company: "La compañía"
        user: "El usuario"
      sl_resource:
        code: "El código"
        description: "La descripción"
        resource: "El recurso"
        query_params: "Los parámetros de la consulta"
        page_size: "El tamaño de página"
